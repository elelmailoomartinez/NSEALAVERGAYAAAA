<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Seleccionar estado</title>
    <style>
      body{font-family: Arial, Helvetica, sans-serif;min-width:220px;padding:10px}
      select,button{width:100%;padding:8px;margin-top:6px}
      label{display:flex;align-items:center;gap:8px;margin-top:8px}
    </style>
  </head>
  <body>
    <h3>Filtro por estado (México)</h3>
    <select id="stateSelect">
      <option value="Todos">Todos (desactivar filtro)</option>
    </select>
    <label><input type="checkbox" id="debugMode"> Modo debug (muestra logs en la consola)</label>
    <button id="saveBtn">Guardar</button>
    <script src="popup.js"></script>
  </body>
</html>
